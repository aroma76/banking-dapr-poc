<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 840" width="100%" height="100%" style="background:#0F172A; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="daprGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F472B6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1100" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="47" fill="#F8FAFC" font-size="18" font-weight="bold">Banking Withdrawal Architecture — High-Level (HLD) &amp; Low-Level (LLD)</text>
  <text x="50" y="67" fill="#94A3B8" font-size="12">Spring Boot Microservices · Dapr Sidecar Service Invocation · PostgreSQL Concurrency &amp; Idempotency</text>

  <!-- ==================================================================== -->
  <!-- TOP SECTION: HIGH-LEVEL DESIGN (HLD) -->
  <!-- ==================================================================== -->
  <rect x="30" y="95" width="1100" height="340" rx="10" fill="#161F30" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="122" fill="#94A3B8" font-size="12" font-weight="bold" letter-spacing="1">SECTION 1: HIGH-LEVEL INFRASTRUCTURE &amp; NETWORK TOPOLOGY (DOCKER: banking-net)</text>

  <!-- Client Box -->
  <rect x="50" y="195" width="130" height="90" rx="8" fill="url(#clientGrad)" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="115" y="230" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Client Tier</text>
  <text x="115" y="250" fill="#BFDBFE" font-size="11" text-anchor="middle">cURL / Postman</text>
  <rect x="75" y="260" width="80" height="18" rx="4" fill="#1E3A8A"/>
  <text x="115" y="273" fill="#93C5FD" font-size="10" font-weight="bold" text-anchor="middle">HTTP POST</text>

  <!-- Docker Network Box -->
  <rect x="230" y="140" width="880" height="275" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="245" y="162" fill="#94A3B8" font-size="11" font-weight="bold">Docker Compose Bridge Network: banking-net</text>

  <!-- Transaction Pod -->
  <rect x="250" y="180" width="180" height="215" rx="8" fill="#1E2235" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="202" fill="#A5B4FC" font-size="11" font-weight="bold" text-anchor="middle">Transaction Pod (Localhost)</text>

  <!-- transaction-app -->
  <rect x="265" y="215" width="150" height="70" rx="6" fill="url(#appGrad)" stroke="#818CF8" stroke-width="1.5"/>
  <text x="340" y="242" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">transaction-app</text>
  <text x="340" y="259" fill="#C7D2FE" font-size="10" text-anchor="middle">Spring Boot API</text>
  <text x="340" y="274" fill="#A5B4FC" font-size="10" font-weight="bold" text-anchor="middle">Port: 8081 (Public)</text>

  <!-- transaction-dapr -->
  <rect x="265" y="310" width="150" height="70" rx="6" fill="url(#daprGrad)" stroke="#F472B6" stroke-width="1.5"/>
  <text x="340" y="337" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">transaction-dapr</text>
  <text x="340" y="354" fill="#FBCFE8" font-size="10" text-anchor="middle">Dapr Sidecar</text>
  <text x="340" y="369" fill="#F472B6" font-size="10" font-weight="bold" text-anchor="middle">Port: 3500 (Localhost)</text>

  <!-- dapr-placement -->
  <rect x="490" y="180" width="160" height="70" rx="6" fill="url(#discGrad)" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="570" y="208" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">dapr-placement</text>
  <text x="570" y="225" fill="#FDE68A" font-size="10" text-anchor="middle">Service Discovery Router</text>
  <text x="570" y="240" fill="#FCD34D" font-size="10" font-weight="bold" text-anchor="middle">Port: 50005</text>

  <!-- Accounting Pod -->
  <rect x="710" y="180" width="180" height="215" rx="8" fill="#1E2235" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="800" y="202" fill="#A5B4FC" font-size="11" font-weight="bold" text-anchor="middle">Accounting Pod (Vault)</text>

  <!-- accounting-dapr -->
  <rect x="725" y="215" width="150" height="70" rx="6" fill="url(#daprGrad)" stroke="#F472B6" stroke-width="1.5"/>
  <text x="800" y="242" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">accounting-dapr</text>
  <text x="800" y="259" fill="#FBCFE8" font-size="10" text-anchor="middle">Dapr Sidecar</text>
  <text x="800" y="274" fill="#F472B6" font-size="10" font-weight="bold" text-anchor="middle">Port: 3501 (Localhost)</text>

  <!-- accounting-app -->
  <rect x="725" y="310" width="150" height="70" rx="6" fill="url(#appGrad)" stroke="#818CF8" stroke-width="1.5"/>
  <text x="800" y="337" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">accounting-app</text>
  <text x="800" y="354" fill="#C7D2FE" font-size="10" text-anchor="middle">Spring Boot Core Engine</text>
  <text x="800" y="369" fill="#A5B4FC" font-size="10" font-weight="bold" text-anchor="middle">Port: 8082 (Internal)</text>

  <!-- banking-postgres -->
  <rect x="940" y="240" width="150" height="110" rx="8" fill="url(#dbGrad)" stroke="#34D399" stroke-width="2"/>
  <text x="1015" y="270" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">banking-postgres</text>
  <text x="1015" y="287" fill="#A7F3D0" font-size="10" text-anchor="middle">PostgreSQL 15</text>
  <text x="1015" y="302" fill="#6EE7B7" font-size="10" font-weight="bold" text-anchor="middle">Port: 5432</text>
  <rect x="955" y="312" width="120" height="24" rx="4" fill="#064E3B"/>
  <text x="1015" y="328" fill="#D1FAE5" font-size="9" text-anchor="middle">accounts &amp; tx_logs</text>

  <!-- HLD Flow Arrows -->
  <!-- 1. Client -> transaction-app -->
  <path d="M 180 250 L 265 250" stroke="#60A5FA" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="185" y="235" width="70" height="16" rx="3" fill="#0F172A" stroke="#3B82F6" stroke-width="0.8"/>
  <text x="220" y="247" fill="#93C5FD" font-size="9" font-weight="bold" text-anchor="middle">[1] POST :8081</text>

  <!-- 2. transaction-app -> transaction-dapr -->
  <path d="M 340 285 L 340 310" stroke="#818CF8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="345" y="288" width="80" height="15" rx="3" fill="#0F172A"/>
  <text x="385" y="300" fill="#C7D2FE" font-size="8.5" text-anchor="middle">[2] localhost:3500</text>

  <!-- 3. transaction-dapr -> dapr-placement (Lookup) -->
  <path d="M 415 330 Q 460 330 460 215 L 490 215" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="445" y="260" fill="#FCD34D" font-size="8.5">Lookup</text>

  <!-- 4. transaction-dapr -> accounting-dapr -->
  <path d="M 415 350 L 725 250" stroke="#F472B6" stroke-width="2.5" fill="none" marker-end="url(#arrowPink)"/>
  <rect x="525" y="290" width="115" height="18" rx="4" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
  <text x="582" y="303" fill="#FBCFE8" font-size="9" font-weight="bold" text-anchor="middle">[3] Dapr Invocation Mesh</text>

  <!-- 5. accounting-dapr -> accounting-app -->
  <path d="M 800 285 L 800 310" stroke="#818CF8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="805" y="288" width="80" height="15" rx="3" fill="#0F172A"/>
  <text x="845" y="300" fill="#C7D2FE" font-size="8.5" text-anchor="middle">[4] localhost:8082</text>

  <!-- 6. accounting-app -> postgres -->
  <path d="M 875 345 L 940 310" stroke="#34D399" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="875" y="315" width="75" height="16" rx="3" fill="#0F172A" stroke="#10B981" stroke-width="0.8"/>
  <text x="912" y="327" fill="#A7F3D0" font-size="8.5" font-weight="bold" text-anchor="middle">[5] SQL Lock</text>


  <!-- ==================================================================== -->
  <!-- BOTTOM SECTION: LOW-LEVEL DESIGN (LLD) -->
  <!-- ==================================================================== -->
  <rect x="30" y="455" width="1100" height="365" rx="10" fill="#161F30" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="482" fill="#94A3B8" font-size="12" font-weight="bold" letter-spacing="1">SECTION 2: LOW-LEVEL IMPLEMENTATION (CLASSES, PIPELINE &amp; DATABASE SCHEMA)</text>

  <!-- Column 1: Transaction Service -->
  <rect x="50" y="495" width="255" height="305" rx="8" fill="#1E293B" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="50" y="495" width="255" height="28" rx="8" fill="#312E81"/>
  <text x="177" y="514" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">1. Transaction Service Layer</text>

  <rect x="62" y="533" width="231" height="75" rx="5" fill="#0F172A" stroke="#6366F1" stroke-width="1"/>
  <text x="72" y="550" fill="#A5B4FC" font-size="10.5" font-weight="bold">TransactionController</text>
  <text x="72" y="566" fill="#94A3B8" font-size="9.5">Route: POST /api/v1/.../withdraw</text>
  <text x="72" y="582" fill="#6EE7B7" font-size="9">✔ Validates: amount &gt; 0</text>
  <text x="72" y="597" fill="#6EE7B7" font-size="9">✔ Validates: currency == 'INR'</text>

  <rect x="62" y="618" width="231" height="85" rx="5" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <text x="72" y="635" fill="#93C5FD" font-size="10.5" font-weight="bold">WithdrawalRequest (DTO)</text>
  <text x="72" y="652" fill="#CBD5E1" font-size="9.5">• accountId: String ("ACC001")</text>
  <text x="72" y="667" fill="#CBD5E1" font-size="9.5">• amount: BigDecimal (500.00)</text>
  <text x="72" y="682" fill="#CBD5E1" font-size="9.5">• currency: String ("INR")</text>
  <text x="72" y="696" fill="#60A5FA" font-size="9.5">• requestId: String [Idempotency]</text>

  <rect x="62" y="713" width="231" height="72" rx="5" fill="#0F172A" stroke="#6366F1" stroke-width="1"/>
  <text x="72" y="730" fill="#A5B4FC" font-size="10.5" font-weight="bold">TransactionService</text>
  <text x="72" y="746" fill="#94A3B8" font-size="9">Calls Dapr via RestTemplate:</text>
  <text x="72" y="761" fill="#F472B6" font-size="8.5">http://localhost:3500/v1.0/invoke/</text>
  <text x="72" y="774" fill="#F472B6" font-size="8.5">accounting-service/method/...</text>


  <!-- Column 2: Dapr Service Mesh Contract -->
  <rect x="325" y="495" width="215" height="305" rx="8" fill="#1E293B" stroke="#DB2777" stroke-width="1.5"/>
  <rect x="325" y="495" width="215" height="28" rx="8" fill="#831843"/>
  <text x="432" y="514" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">2. Dapr Mesh Contract</text>

  <rect x="337" y="533" width="191" height="252" rx="5" fill="#0F172A" stroke="#EC4899" stroke-width="1"/>
  <text x="347" y="555" fill="#F472B6" font-size="11" font-weight="bold">Decoupled Invocation</text>
  <text x="347" y="575" fill="#CBD5E1" font-size="9.5">• Target: <b>accounting-service</b></text>
  <text x="347" y="593" fill="#CBD5E1" font-size="9.5">• Zero hardcoded IPs</text>
  <text x="347" y="611" fill="#CBD5E1" font-size="9.5">• Automatic mDNS discovery</text>
  <text x="347" y="629" fill="#CBD5E1" font-size="9.5">• Built-in retries &amp; backoff</text>
  <text x="347" y="647" fill="#CBD5E1" font-size="9.5">• W3C trace propagation</text>

  <rect x="347" y="665" width="171" height="55" rx="4" fill="#251D29" stroke="#DB2777" stroke-width="0.8"/>
  <text x="432" y="683" fill="#FBCFE8" font-size="9.5" font-weight="bold" text-anchor="middle">Microservice Decoupling</text>
  <text x="432" y="698" fill="#F472B6" font-size="8.5" text-anchor="middle">Caller only knows app-id</text>
  <text x="432" y="711" fill="#F472B6" font-size="8.5" text-anchor="middle">No port changes break code</text>

  <rect x="347" y="730" width="171" height="42" rx="4" fill="#1C2128"/>
  <text x="432" y="747" fill="#6EE7B7" font-size="9" font-weight="bold" text-anchor="middle">Transport: gRPC</text>
  <text x="432" y="761" fill="#94A3B8" font-size="8" text-anchor="middle">High throughput between sidecars</text>


  <!-- Column 3: Accounting Service (@Transactional Pipeline) -->
  <rect x="560" y="495" width="310" height="305" rx="8" fill="#1E293B" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="560" y="495" width="310" height="28" rx="8" fill="#312E81"/>
  <text x="715" y="514" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">3. Accounting Service (4-Step Pipeline)</text>

  <rect x="572" y="533" width="286" height="252" rx="5" fill="#0F172A" stroke="#6366F1" stroke-width="1"/>
  <text x="584" y="555" fill="#A5B4FC" font-size="11" font-weight="bold">@Transactional processWithdrawal()</text>

  <!-- Step 1 -->
  <rect x="584" y="568" width="262" height="42" rx="4" fill="#1E2235" stroke="#3B82F6" stroke-width="0.8"/>
  <text x="592" y="583" fill="#93C5FD" font-size="9.5" font-weight="bold">Step 1: Idempotency Check</text>
  <text x="592" y="599" fill="#CBD5E1" font-size="8.5">txRepo.findByRequestId(req.requestId) ➔ Cached if exists</text>

  <!-- Step 2 -->
  <rect x="584" y="618" width="262" height="42" rx="4" fill="#1E2235" stroke="#818CF8" stroke-width="0.8"/>
  <text x="592" y="633" fill="#C7D2FE" font-size="9.5" font-weight="bold">Step 2: Account Existence Check</text>
  <text x="592" y="649" fill="#CBD5E1" font-size="8.5">accountRepo.findByAccountId(id) ➔ 404 if not found</text>

  <!-- Step 3 -->
  <rect x="584" y="668" width="262" height="52" rx="4" fill="#162822" stroke="#10B981" stroke-width="1"/>
  <text x="592" y="683" fill="#6EE7B7" font-size="9.5" font-weight="bold">Step 3: Atomic Balance Deduction</text>
  <text x="592" y="698" fill="#A7F3D0" font-size="8.5">UPDATE accounts SET balance = balance - :amt</text>
  <text x="592" y="711" fill="#FCD34D" font-size="8.5">WHERE balance &gt;= :amt (0 rows ➔ INSUFFICIENT_BAL)</text>

  <!-- Step 4 -->
  <rect x="584" y="728" width="262" height="45" rx="4" fill="#1E2235" stroke="#059669" stroke-width="0.8"/>
  <text x="592" y="743" fill="#6EE7B7" font-size="9.5" font-weight="bold">Step 4: Audit Log Write</text>
  <text x="592" y="759" fill="#CBD5E1" font-size="8.5">txRepo.save(new WithdrawalTransaction(..., SUCCESS))</text>


  <!-- Column 4: PostgreSQL Database Schemas -->
  <rect x="890" y="495" width="240" height="305" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
  <rect x="890" y="495" width="240" height="28" rx="8" fill="#064E3B"/>
  <text x="1010" y="514" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">4. PostgreSQL Database Schemas</text>

  <!-- accounts table -->
  <rect x="902" y="533" width="216" height="110" rx="5" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="912" y="552" fill="#6EE7B7" font-size="10.5" font-weight="bold">TABLE: accounts</text>
  <text x="912" y="570" fill="#CBD5E1" font-size="9">• id: BIGSERIAL [PRIMARY KEY]</text>
  <text x="912" y="586" fill="#CBD5E1" font-size="9">• account_id: VARCHAR [UNIQUE]</text>
  <text x="912" y="602" fill="#FCD34D" font-size="9" font-weight="bold">• balance: NUMERIC (CHECK &gt;= 0)</text>
  <text x="912" y="618" fill="#CBD5E1" font-size="9">• currency: CHAR(3) ('INR')</text>
  <text x="912" y="632" fill="#94A3B8" font-size="8.5">• version: BIGINT (Optimistic lock)</text>

  <!-- withdrawal_transactions table -->
  <rect x="902" y="652" width="216" height="133" rx="5" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="912" y="670" fill="#6EE7B7" font-size="10.5" font-weight="bold">TABLE: withdrawal_transactions</text>
  <text x="912" y="688" fill="#CBD5E1" font-size="9">• id: BIGSERIAL [PRIMARY KEY]</text>
  <text x="912" y="703" fill="#CBD5E1" font-size="9">• transaction_id: VARCHAR [UNIQUE]</text>
  <text x="912" y="718" fill="#60A5FA" font-size="9" font-weight="bold">• request_id: VARCHAR [UNIQUE]</text>
  <text x="912" y="733" fill="#94A3B8" font-size="8.5">&nbsp;&nbsp;(Enforces Idempotency at DB level)</text>
  <text x="912" y="749" fill="#CBD5E1" font-size="9">• amount, currency, status</text>
  <text x="912" y="764" fill="#CBD5E1" font-size="9">• remaining_balance: NUMERIC</text>
  <text x="912" y="777" fill="#94A3B8" font-size="8.5">• created_at: TIMESTAMP</text>

  <!-- LLD Connecting Arrows -->
  <path d="M 305 650 L 325 650" stroke="#818CF8" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 540 650 L 560 650" stroke="#F472B6" stroke-width="1.5" fill="none" marker-end="url(#arrowPink)"/>
  <path d="M 870 650 L 890 650" stroke="#34D399" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
</svg>